[gcode_macro G32]
gcode:

 

    {% if not 'xyz' in printer.toolhead.homed_axes %}
        RESPOND MSG="HOME NOT DONE... WORKING"
        G28
    {% endif %}
  {% if printer.quad_gantry_level.applied|lower == 'false' %}
        RESPOND MSG="QGL NOT DONE... WORKING"
        QUAD_GANTRY_LEVEL
            
        {% endif %}

    #G28
    #QUAD_GANTRY_LEVEL
    
    G28
    ##	Uncomment for for your size printer:
    #--------------------------------------------------------------------
    ##	Uncomment for 250mm build
    #G0 X125 Y125 Z30 F3600
    
    ##	Uncomment for 300 build
    G0 X150 Y150 Z30 F3600
    
    ##	Uncomment for 350mm build
    #G0 X175 Y175 Z30 F3600
    #--------------------------------------------------------------------
[gcode_macro WIPE_NOZZLE]
gcode:
	G90
    G1 X235 Y299 Z2 F3000
	G1 X278 Y299 Z2 F3000
	G1 X235 Y299 Z2 F3000
	G1 X278 Y299 Z2 F3000
	G1 X235 Y299 Z2 F3000
	G1 X278 Y299 Z2 F3000
	G1 X235 Y299 Z2 F3000
	G1 X278 Y299 Z2 F3000
	G1 X235 Y299 Z2 F3000
	G1 X278 Y299 Z2 F3000
	G1 X235 Y299 Z2 F3000
	G1 Z10 F300
    G1 Y250 F3000
    # G1 X 300 Y 300 Z 12 F3000; Position in fron the scrub
    # G1 X 240 Y 300 Z 12 F3000; First wipe
    # G1 X 300 Y 300 Z 12 F3000; First
    # G1 X 240 Y 300 Z 12 F3000; First
    # G1 X 300 Y 300 Z 12 F3000; second wipe
    # G1 X 240 Y 300 Z 12 F3000; First wipe
    # G1 X 300 Y 300 Z 12 F3000; First
    # G1 X 240 Y 300 Z 12 F3000; First
    # G1 X 240 Y 300 Z 25 F3000
[gcode_macro print_start]
gcode:
    RESPOND TYPE=echo MSG='---- INICIO SCRIPT PRINT START---- '   
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(190)|float %}
    # Heat bed for probing
    G28
    RESPOND TYPE=echo MSG='Objetivo temperatura cama '{BED_TEMP}
    #SET_GCODE_OFFSET Z=0
    
	M190 S{BED_TEMP}
 # If you are generating a new bed mesh:
    RESPOND TYPE=echo MSG='Realizando Quad gantry level '
    QUAD_GANTRY_LEVEL
    RESPOND TYPE=echo MSG='HOME '
    G28
  
    RESPOND TYPE=echo MSG='Realizando Quad Bed Mesh '
    BED_MESH_CALIBRATE
    #BED_MESH_CALIBRATE ADAPTIVE=1
    ## NOTE:    The adaptive meshing feature requires exclude_object     ##
    ##      and may require 'Label Objects' to be enabled in the slicer  ##
    ##           To mesh without it just use BED_MESH_CALIBRATE          ##

    # If you are loading an existing mesh:
    #BED_MESH_PROFILE LOAD=default
    #SET_GCODE_OFFSET Z=0.1
    # Move the nozzle near the bed
    RESPOND TYPE=echo MSG='Objetivo temperatura Hotend '{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}
	# Use absolute coordinates
    G90
    # Home the printer
    #G28
    RESPOND TYPE=echo MSG='Limpiando nozzle '
	WIPE_NOZZLE
    RESPOND TYPE=echo MSG='HOME '
	G28
    # If you are using QGL:
    #QUAD_GANTRY_LEVEL
    #G28 Z

    # If you are using Z-Tilt:
    #Z_TILT_ADJUST

    RESPOND TYPE=echo MSG='SKEW '
    G1 Y-100 Z25 F3000
    SET_SKEW XY=140.2,141.7,99.4
    # Set and wait for nozzle to reach printing temperature
    G90
    # Start printing!

    RESPOND TYPE=echo MSG='-----PRINT START END ---- '
[gcode_macro _bot_data]
variable_lapse_video_size: 0
variable_lapse_filename: 'None'
variable_lapse_path: 'None'
gcode:
    M118 Setting bot lapse variables

[force_move]
# Enable commands that force potentially unsafe movement
enable_force_move: True

[gcode_macro safehoming]
description: toolhead safez 10mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=0
  G0 Z10 F600
  

[gcode_macro _HOME_X]
gcode:
    
	# Always use consistent run_current on A/B steppers during sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.5 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 X
    # Move away
    G91
    G1 X-10 F2000
    
    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
	_KlickyDebug msg="Homing override y printer cfg"
    # Set current for sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.5 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 Y
    # Move away
    G91
    G1 Y-10 F1200

    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Z]
gcode:
    # home_xy_position:95,299
    # Home
    # G0  X95 Y299 F300
	g91
	G1 X -195.5 Y 9 z 15 F2000 # stock switch 
	
	G28 Z
	# G0 Z20 F300
    # Move away
    G91
    G1 y -20 z 15 F1200
    
    

[homing_override]
axes: xyz
gcode:
  safehoming
 {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

 {% if home_all or 'X' in params %}
   _HOME_X
 {% endif %}

 {% if home_all or 'Y' in params %}
   _HOME_Y
 {% endif %}
  
 {% if home_all or 'Z' in params %}
   _HOME_Z
 {% endif %}

    
[gcode_macro M300]
gcode:
     # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(260)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
      #SET_PIN PIN=Case_Light VALUE=0
      #SET_PIN PIN=LCD_Light VALUE=0
    {% if S > 0 %}
      SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S }
      #SET_PIN PIN=Case_Light VALUE=0.5 CYCLE_TIME={ 1.0/S }
      #SET_PIN PIN=LCD_Light VALUE=0.5 CYCLE_TIME={ 1.0/S }
      G4 P{P}
    {% else %}
      G4 P{P}
    {% endif %}
      SET_PIN PIN=BEEPER_pin VALUE=0
      #SET_PIN PIN=Case_Light VALUE=1
      #SET_PIN PIN=LCD_Light VALUE=1
  
[output_pin BEEPER_pin]
pin: PC9
#   Beeper pin. This parameter must be provided.
#   ar37 is the default RAMPS/MKS pin.
pwm: True
#   A piezo beeper needs a PWM signal, a DC buzzer doesn't.
value: 0
#   Silent at power on, set to 1 if active low.
shutdown_value: 0
#   Disable at emergency shutdown (no PWM would be available anyway).
cycle_time: 0.0005

#   Default PWM frequency : 0.001 = 1ms will give a tone of 1kHz
#   Although not pitch perfect.
[gcode_macro PRINT_TEST]
gcode:
  {% if not 'xyz' in printer.toolhead.homed_axes %}
        RESPOND MSG="HOME NOT DONE... WORKING"
        G28
    {% endif %}
  {% if printer.quad_gantry_level.applied|lower == 'false' %}
        RESPOND MSG="QGL NOT DONE... WORKING"
        QUAD_GANTRY_LEVEL
            
        {% endif %}
       
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-8.0 F3600                 ; retract filament
    
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
   
## WIPE_NOZZLE
    G0  X125 Y250 F3600            ; park nozzle at rear
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
   
   
