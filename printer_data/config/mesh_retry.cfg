# Bed mesh con comprobacion del rango (max - min de los puntos medidos).
# En print_start sustituye a:
#     PROBE_EDDY_NG_TAP TARGET_Z=-1.00
#     BED_MESH_CALIBRATE METHOD=rapid_scan
# por:
#     MESH_RETRY
# Si el rango es >= LIMIT (0.4 mm) repite QUAD_GANTRY_LEVEL + G28 + mesh,
# hasta RETRIES (3) veces. Si sigue alto avisa por consola y la impresion
# continua con la ultima malla.
# El tap del z offset se hace una sola vez, al final: cada G28 de las
# repeticiones rehace Z con el Eddy y anularia un tap hecho antes.
#
# Klipper evalua cada macro entera antes de ejecutarla y no admite recursion,
# por eso la comprobacion es una macro aparte llamada varias veces seguidas:
# asi cada llamada lee la malla que acaba de generar la anterior.

[gcode_macro MESH_RETRY]
description: Bed mesh; repite QGL + mesh si el rango supera LIMIT
gcode:
    {% set limit = params.LIMIT|default(0.4)|float %}
    {% set retries = params.RETRIES|default(3)|int %}
    SET_GCODE_VARIABLE MACRO=_MESH_RETRY_CHECK VARIABLE=done VALUE=0
    _MESH_RETRY_MESH
    {% for attempt in range(1, retries + 2) %}
    _MESH_RETRY_CHECK ATTEMPT={attempt} RETRIES={retries} LIMIT={limit}
    {% endfor %}
    _MESH_RETRY_TAP

[gcode_macro _MESH_RETRY_MESH]
gcode:
    BED_MESH_CALIBRATE METHOD=rapid_scan

# Tap en el mismo sitio y estado que antes: donde deja la boquilla el G28
# (X140 Y140) y sin malla cargada. Despues se vuelve a cargar la malla.
[gcode_macro _MESH_RETRY_TAP]
gcode:
    {% set profile = printer.bed_mesh.profile_name or 'default' %}
    G90
    G0 Z5 F1000
    G0 X140 Y140 F6000
    BED_MESH_CLEAR
    PROBE_EDDY_NG_TAP TARGET_Z=-1.00
    BED_MESH_PROFILE LOAD={profile}

[gcode_macro _MESH_RETRY_CHECK]
variable_done: 0
gcode:
    {% set attempt = params.ATTEMPT|int %}
    {% set retries = params.RETRIES|int %}
    {% set limit = params.LIMIT|float %}
    {% if not done %}
        {% set points = printer.bed_mesh.probed_matrix|sum(start=[]) %}
        {% set spread = (points|max - points|min) if points else 999.0 %}
        {% if spread < limit %}
            RESPOND TYPE=echo MSG='Malla OK: rango {'%.3f' % spread} mm'
            SET_GCODE_VARIABLE MACRO=_MESH_RETRY_CHECK VARIABLE=done VALUE=1
        {% elif attempt <= retries %}
            RESPOND TYPE=echo MSG='Rango {'%.3f' % spread} mm >= {limit}: repitiendo QGL y mesh ({attempt}/{retries})'
            QUAD_GANTRY_LEVEL
            # G28 completo: _HOME_Z mueve X/Y en relativo y necesita X/Y recien homeados
            G28
            _MESH_RETRY_MESH
        {% else %}
            RESPOND TYPE=error MSG='Rango {'%.3f' % spread} mm tras {retries} repeticiones: se continua igualmente'
        {% endif %}
    {% endif %}
