[gcode_macro PURGE_LINE]
gcode:
  #{% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
  #M109 S{EXTRUDER_TEMP}
  G0 X300 Y300 Z14 F10000                      # Moves to starting point                            
  G1 X300 Y300 Z14 E20 F300                                # Purge 
  wipe_nozzle
  g0 X150 Y150
  G90                                              # Absolut position

