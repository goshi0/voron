# dir_pin: PC13
# enable_pin: !PE5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
# uart_pin: PC14
uart_pin: PC15

# uart_pin: PD10
